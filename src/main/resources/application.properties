spring.application.name=TeamLoggerC

spring.datasource.url=jdbc:mysql://localhost:3306/teamlogger?createDatabaseIfNotExist=true
spring.datasource.username=***
spring.datasource.password=***
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Run Java AWT in graphical mode
spring.main.headless=false

# Screenshot storage
teamlogger.screenshot.directory=./screenshots

